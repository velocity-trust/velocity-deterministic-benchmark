[package]
name = "velocity-membus-benchmark"
version = "0.1.0"
edition = "2021"
authors = ["Velocity Technical Infrastructure Statutory Trust <timdarcelien@icloud.com>"]
description = "Deterministic execution and memory bus benchmarking harness for ARMv8/AArch64"
license = "Apache-2.0"
repository = "https://github.com/velocity-trust/velocity-deterministic-benchmark"
readme = "README.md"

[features]
default = []
std = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = true

[[bench]]
name = "benchmark_harness"
harness = false
